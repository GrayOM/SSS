<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Source Vulnerability Analyzer</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main class="page-shell">
    <section class="hero-panel">
      <div>
        <p class="eyebrow">Security Assessment Assistant</p>
        <h1>ZIP 소스코드 취약점 분석</h1>
        <p class="hero-copy">프론트엔드 소스 ZIP을 업로드하면 취약점 후보, 증적, 검증 절차, 브라우저 콘솔 PoC를 진단자 관점으로 정리합니다.</p>
      </div>
      <div class="status-panel" aria-live="polite">
        <span class="status-label">상태</span>
        <p id="status">분석 대기 중</p>
      </div>
    </section>

    <section class="upload-panel" aria-label="소스코드 업로드">
      <form id="analyze-form">
        <label class="file-picker" for="zip-file">
          <span class="file-title">분석 대상 ZIP 선택</span>
          <span class="file-subtitle">JS, HTML, TypeScript, Vue 등 프론트엔드 소스가 포함된 ZIP</span>
          <span id="selected-file-name" class="selected-file-name">선택된 파일 없음</span>
          <input id="zip-file" type="file" accept=".zip" required />
        </label>
        <div class="actions">
          <button type="submit" class="primary-button">분석 시작</button>
          <button type="button" id="download-json" class="secondary-button">JSON 다운로드</button>
        </div>
      </form>
    </section>

    <section id="summary" class="summary-grid"></section>
    <section id="findings" class="results-stack"></section>
    <pre id="result" class="hidden"></pre>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
