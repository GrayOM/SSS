name: ai-test-report

on:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run pytest
        run: |
          mkdir -p .ai/test_report
          python -m pytest tests/ -v 2>&1 | tee .ai/test_report/latest_pytest.log
      - name: Build compact report
        if: always()
        run: |
          python scripts/collect_test_report.py --log .ai/test_report/latest_pytest.log --out .ai/test_report/latest_summary.json || true
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-test-report
          path: .ai/test_report/
